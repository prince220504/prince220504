name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: prince220504
          template: classic
          base: header, activity
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_limit: 5
