name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Fetch streak SVG
        run: |
          curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 10 \
            "https://streak-stats.demolab.com?user=prince220504&theme=tokyonight&hide_border=true" \
            -o streak-graph.svg.new && mv streak-graph.svg.new streak-graph.svg

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak-graph.svg dist/
          git diff --staged --quiet || git commit -m "chore: refresh metrics"
          git push
