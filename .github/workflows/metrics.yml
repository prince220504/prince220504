name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Activity graph (isometric calendar)
        uses: lowlighter/metrics@latest
        with:
          filename: activity-graph.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: prince220504
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no

      - name: Streak graph (habits + commit charts)
        uses: lowlighter/metrics@latest
        with:
          filename: streak-graph.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: prince220504
          base: ""
          config_timezone: Asia/Kolkata
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_calendar: yes
          plugin_calendar_limit: 1
