name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch streak SVG
        run: |
          curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 10 \
            "https://streak-stats.demolab.com?user=prince220504&theme=tokyonight&hide_border=true" \
            -o streak-graph.svg.new && mv streak-graph.svg.new streak-graph.svg

      - name: Fetch activity graph SVG
        run: |
          curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 10 \
            "https://github-readme-activity-graph.vercel.app/graph?username=prince220504&theme=tokyo-night&hide_border=true" \
            -o activity-graph.svg.new && mv activity-graph.svg.new activity-graph.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak-graph.svg activity-graph.svg
          git diff --staged --quiet || git commit -m "chore: refresh metrics SVGs"
          git push
